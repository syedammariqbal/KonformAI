[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "konformai"
version = "0.1.0"
description = "Agentic compliance classification tool for AI systems in German financial sector (EU AI Act & BaFin)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "KonformAI Engineering Team" }
]
license = { text = "MIT" }

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
    "E402", # module level import not at top of file (scripts sys.path adjustment)
    "B904", # raise ... from err in except clause
    "B905", # zip without strict parameter
    "F841", # local variable assigned but never used
]
